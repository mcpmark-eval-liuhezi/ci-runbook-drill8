name: Runbook drill

on:
  workflow_dispatch:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Log quick marker
        run: echo "DRILL-LOG-MARKER-A17"
      - name: Signal quick job done
        run: echo "quick job done"

  long-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Hold the line for 30 minutes
        run: sleep 1800
